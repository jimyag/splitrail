<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Splitrail · 本地用量</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">Splitrail</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-subtitle" data-i18n="localUsage">本地用量</span>
      </div>
      <div class="header-actions">
        <span id="status" class="status" role="status"></span>
        <button id="refresh" class="btn" type="button">
          <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.46-3.54"></path><path d="M13 2.8v2.9h-2.9"></path></svg>
          <span data-i18n="refresh">刷新</span>
        </button>
        <select id="language" class="btn" aria-label="语言">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </header>
  <nav class="tabs-bar" id="tabs-bar" aria-label="视图">
    <div id="tabs" class="wrap tabs"></div>
  </nav>
  <div id="filters" class="wrap filters"></div>
  <main id="view" class="wrap view"></main>
</body>
</html>
